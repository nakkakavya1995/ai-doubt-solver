services:
  - type: web
    name: ai-doubt-solver
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --workers=2 --threads=8 --timeout=30 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GROK_API_KEY
        sync: false
